<!--
  Paste into Authentication -> Emails -> Templates -> Reset Password in the Supabase dashboard.
  The link opens the app (once peyo://auth is in the Redirect URLs allowlist); the code is for an
  email read on a different device, and is typed into Forgot password? on the sign-in screen.
-->
<h2>Reset your Peyo password</h2>

<p>On your phone, tap this link to choose a new password:</p>
<p><a href="{{ .ConfirmationURL }}">Reset password</a></p>

<p>Or enter this code in Peyo under <strong>Forgot password?</strong>:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 4px;">{{ .Token }}</p>

<p>If you did not ask for this, ignore this email. Your password stays the same.</p>
