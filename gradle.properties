org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Release signing is read from these properties. Define them in ~/.gradle/gradle.properties (or
# pass them with -P on a CI runner) -- this file is committed, so real values must never live here.
#   RELEASE_STORE_FILE=/absolute/path/to/my-release-key.jks
#   RELEASE_STORE_PASSWORD=...
#   RELEASE_KEY_ALIAS=...
#   RELEASE_KEY_PASSWORD=...
# With no keystore present the release build still succeeds, just unsigned.
